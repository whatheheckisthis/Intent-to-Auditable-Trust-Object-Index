# File: .github/actions/runtime-gate/action.yml
# Role: Composite runtime consistency gate for tool version and ingress digest verification.
# Constraints enforced: runtime-version-verification, ENV-contamination-check, ingress-digest-check, fail-fast non-zero exits.
# Upstream: ROOT
# Downstream: all workflow jobs
# ISM controls: ISM-0407, ISM-1491, ISM-1753
name: Runtime Consistency Gate
description: >
  Verifies tool versions against pipeline/runtime-versions.json and checks
  artefact digest integrity against producer digest manifests.
inputs:
  job-id:
    description: Unique job identifier for scoped output files
    required: true
  ingress-manifest-path:
    description: Path to digest manifest from upstream producer job
    required: false
    default: ''
  pipeline-run-ref:
    description: Git SHA or workflow run identifier
    required: true
runs:
  using: composite
  steps:
    - name: Verify runtime tool versions and ENV cleanliness
      shell: bash
      run: |
        set -euo pipefail
        node pipeline/verify-runtime.js \
          --config pipeline/runtime-versions.json \
          --output pipeline/outputs/runtime-verification.json
        STATUS=$(jq -r '.overall_status' pipeline/outputs/runtime-verification.json)
        if [ "$STATUS" != "RUNTIME_CONSISTENT" ]; then
          node pipeline/emit-failure.js \
            --type RUNTIME_INCONSISTENT \
            --stage "${{ inputs.job-id }}" \
            --run-ref "${{ inputs.pipeline-run-ref }}"
          exit 1
        fi

    - name: Verify artefact ingress digests
      if: inputs.ingress-manifest-path != ''
      shell: bash
      run: |
        set -euo pipefail
        node pipeline/verify-artefact-ingress.js \
          --manifest "${{ inputs.ingress-manifest-path }}" \
          --output "pipeline/outputs/ingress-verification-${{ inputs.job-id }}.json" \
          --job-id "${{ inputs.job-id }}"
        STATUS=$(jq -r '.overall_status' "pipeline/outputs/ingress-verification-${{ inputs.job-id }}.json")
        if [ "$STATUS" != "INGRESS_VERIFIED" ]; then
          node pipeline/emit-failure.js \
            --type ARTEFACT_INTEGRITY_FAILURE \
            --stage "${{ inputs.job-id }}" \
            --run-ref "${{ inputs.pipeline-run-ref }}"
          exit 1
        fi
