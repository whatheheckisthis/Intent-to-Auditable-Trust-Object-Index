name: Agent Q review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: agent-q-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Call Agent Q
        id: q
        env:
          AGENT_Q_URL: https://tcaefdirgffncwfwrlbe.supabase.co/functions/v1/agent-q/mcp
          AGENT_Q_TOKEN: ${{ secrets.AGENT_Q_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(jq -nc --arg o "${{ github.repository_owner }}" --arg r "${{ github.event.repository.name }}" --argjson n ${{ github.event.pull_request.number }} \
            '{jsonrpc:"2.0",id:1,method:"tools/call",params:{name:"review_pull_request",arguments:{owner:$o,repo:$r,number:$n}}}')
          auth=(-H "x-github-token: $GH_TOKEN"); [ -n "$AGENT_Q_TOKEN" ] && auth+=(-H "Authorization: Bearer $AGENT_Q_TOKEN")
          curl -fsS "$AGENT_Q_URL" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' "${auth[@]}" -d "$body" > resp.json
          jq -r '.result.content[0].text' resp.json > review.md
          { echo '<!-- agent-q -->'; cat review.md; } > comment.md
          grep -q 'CHANGES REQUESTED' review.md && echo "verdict=changes" >> "$GITHUB_OUTPUT" || echo "verdict=ok" >> "$GITHUB_OUTPUT"
          cat review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update review comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- agent-q -->")) | .id' | head -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md >/dev/null
          else gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md >/dev/null; fi

      - name: Enforce verdict
        if: steps.q.outputs.verdict == 'changes'
        run: |
          echo "Agent Q requested changes. See the review comment."
          exit 1
